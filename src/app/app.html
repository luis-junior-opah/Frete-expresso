<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>
  <img src="logo-ilc.png" alt="ILC Logo" class="toolbar-logo">
  <span class="toolbar-title">Frete Expresso - Angular</span>
  <span class="spacer"></span>
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" [opened]="!isCollapsed()" class="app-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span class="menu-label">Gestão Fretes Expressos</span>
      </a>
      <a mat-list-item routerLink="/cotacoes" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span class="menu-label">Acompanhamento Cotações</span>
      </a>
      <a mat-list-item routerLink="/configuracoes" routerLinkActive="active-link">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span class="menu-label">Configurações</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
